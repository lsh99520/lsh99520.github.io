<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>birthday.exe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ===== 색상 토큰 ===== */
  :root {
    --bg: #1c140c;          /* 탄 커피색 화면 */
    --glow: #ffb547;        /* 앰버 형광 글씨 */
    --dim: #a8763a;         /* 흐린 글씨 */
    --soft: #3a2a18;        /* 입력창 배경 */
    --err: #ff7a6b;         /* 오류 */
    --duck: #ffd23f;
    --duck-dark: #e8a51c;
    --beak: #ff8a2a;
    --hat: #ff5f8f;
    --star: #fff3b0;
    --eye: #1c140c;
    --shine: #fffbe6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #fbf0dc; --glow: #6b3a00; --dim: #9a6a35; --soft: #f1dfbf;
      --err: #c0392b; --eye: #2a1a08;
    }
  }
  :root[data-theme="light"] {
    --bg: #fbf0dc; --glow: #6b3a00; --dim: #9a6a35; --soft: #f1dfbf;
    --err: #c0392b; --eye: #2a1a08;
  }
  :root[data-theme="dark"] {
    --bg: #1c140c; --glow: #ffb547; --dim: #a8763a; --soft: #3a2a18;
    --err: #ff7a6b; --eye: #1c140c;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--glow);
    font-family: "Nanum Gothic Coding", "D2Coding", ui-monospace, Menlo, Consolas, monospace;
    font-size: 16px; line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    max-width: 640px; margin: 0 auto;
    padding: 28px 20px 64px;
    text-shadow: 0 0 6px color-mix(in srgb, var(--glow) 35%, transparent);
  }
  .line { white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; margin: 0; }
  .dim { color: var(--dim); }
  .err { color: var(--err); }
  .gap { height: 0.9em; }

  .prompt-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .prompt-row input {
    flex: 1; min-width: 0;
    background: var(--soft); color: var(--glow);
    border: none; border-bottom: 2px solid var(--dim);
    font: inherit; padding: 6px 10px; letter-spacing: 0.4em;
    border-radius: 2px;
  }
  .prompt-row input:focus { outline: none; border-bottom-color: var(--glow); }
  .prompt-row button, .again {
    font: inherit; color: var(--bg); background: var(--glow);
    border: none; padding: 7px 14px; border-radius: 2px; cursor: pointer;
  }
  button:focus-visible, input:focus-visible { outline: 2px dashed var(--glow); outline-offset: 3px; }

  .cursor {
    display: inline-block; width: 0.6em; height: 1.1em;
    background: var(--glow); vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 엔딩: 오리 */
  .finale { margin-top: 28px; text-align: center; }
  .duck { width: min(55vw, 220px); height: auto; image-rendering: pixelated; }
  .pic { width: min(60vw, 240px); height: auto; border-radius: 4px; }
  .pic.pop { animation: pop 0.6s cubic-bezier(.3,1.6,.5,1) both; }
  .duck.pop { animation: pop 0.6s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes pop { from { transform: scale(0.2) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .hb { font-size: clamp(26px, 8vw, 40px); font-weight: 700; margin: 12px 0 4px; letter-spacing: 0.02em; }
  .again { margin-top: 18px; background: transparent; color: var(--dim); border: 1px solid var(--dim); }

  canvas#confetti { position: fixed; inset: 0; pointer-events: none; width: 100%; height: 100%; }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
    .duck.pop, .pic.pop { animation: none; }
  }
</style>
</head>
<body>
<main class="screen" id="screen" aria-live="polite"></main>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* =========================================================
   ✏️ 여기만 고치면 돼요
   ========================================================= */
const CONFIG = {
  password: "1002",          // 강사님 생일 MMDD (예: 3월 15일 → "0315")
  teacher: "0\u20A9 강사님",          // 강사님 성함으로 바꿔도 좋아요 (예: "김싸피 강사님")
  from: "이신혁 드림",    // 보내는 사람
  letter: [
    "강사님, 생일 축하드립니다!",
    "",
    "처음 뵀을 때는 조금 무뚝뚝해 보이시고",
    "말수도 적으신 것 같아 살짝 걱정했었어요.",
    "그런데 알고 보니 누구보다 섬세하고 다정하셔서",
    "정말 다행이었고, 감사했습니다.",
    "",
    "코딩 테스트도, 파이썬도 처음이라",
    "막막할 때가 많았는데",
    "막힐 때마다 제 수준에 맞춰 길을 잡아주신 덕분에",
    "지금까지 열심히 해올 수 있었어요.",
    "",
    "남은 싸피 기간 동안에도",
    "2반과 함께 좋은 시간 보내주세요!",
    "",
    "오늘 하루, 버그 없이 행복한 하루 보내세요 🎂",
  ],
};
/* ========================================================= */

const screen = document.getElementById("screen");
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));

function addLine(text = "", cls = "") {
  const p = document.createElement("p");
  p.className = "line " + cls;
  p.textContent = text;
  screen.appendChild(p);
  return p;
}
function gap() { const d = document.createElement("div"); d.className = "gap"; screen.appendChild(d); }

async function typeLine(text, cls = "", speed = 45) {
  const p = addLine("", cls);
  const cur = document.createElement("span"); cur.className = "cursor";
  p.appendChild(cur);
  for (const ch of [...text]) {
    cur.before(ch);
    await sleep(speed);
  }
  cur.remove();
  window.scrollTo({ top: document.body.scrollHeight, behavior: reduce ? "auto" : "smooth" });
  return p;
}

/* ---------- 1. 부팅 & 로그인 ---------- */
async function boot() {
  screen.innerHTML = "";
  addLine("birthday.exe v1.0", "dim");
  addLine("(c) SSAFY · build " + new Date().getFullYear(), "dim");
  gap();
  await typeLine("시스템을 불러오는 중...", "dim", 30);
  await sleep(300);
  await typeLine(`${CONFIG.teacher}께 도착한 편지가 1통 있습니다.`);
  gap();
  await typeLine("login: " + CONFIG.teacher, "", 40);
  showPrompt();
}

function showPrompt() {
  addLine("힌트: 오늘 날짜 네 자리 (MMDD)", "dim");
  const row = document.createElement("form");
  row.className = "prompt-row";
  row.innerHTML = `
    <label for="pw">password:</label>
    <input id="pw" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="비밀번호 네 자리">
    <button type="submit">열기</button>`;
  screen.appendChild(row);
  const input = row.querySelector("input");
  setTimeout(() => input.focus(), 50);
  row.addEventListener("submit", async e => {
    e.preventDefault();
    const v = input.value.trim();
    row.remove();
    addLine("password: " + "*".repeat(v.length || 1));
    if (v === CONFIG.password) {
      await typeLine("인증 완료. 환영합니다 :)", "", 35);
      gap();
      openLetter();
    } else {
      await typeLine("로그인 실패: 비밀번호가 맞지 않습니다.", "err", 25);
      await typeLine("오늘이 무슨 날인지 다시 떠올려 보세요 👀", "dim", 25);
      gap();
      showPrompt();
    }
  });
}

/* ---------- 2. 편지 출력 ---------- */
async function openLetter() {
  await typeLine("$ cat letter.txt", "", 60);
  gap();
  for (const l of CONFIG.letter) {
    if (l === "") { gap(); await sleep(250); continue; }
    await typeLine(l, "", 55);
    await sleep(180);
  }
  gap();
  await typeLine("— " + CONFIG.from, "dim", 50);
  await sleep(500);
  finale();
}

/* ---------- 3. 엔딩: 파티 오리 ---------- */
const DUCK = [
  "........S.......",
  ".......PP.......",
  "......PSPP......",
  ".....PPPSPP.....",
  ".....YYYYYY.....",
  "....YYYYYYYY....",
  "....YWKYYYYY....",
  "..OOOYYYYYYY....",
  "..OOOYYYYYYY....",
  "....YYYYYYYY....",
  "....YYYYYYYYYYY.",
  "..YYYYYYYYYYYYYY",
  "..YYYYYYDDYYYYY.",
  "..YYYYYDDDDYYYY.",
  "...YYYYYYYYYYY..",
  "....YYYYYYYYY...",
];
const COLORS = { Y: "var(--duck)", D: "var(--duck-dark)", O: "var(--beak)", K: "var(--eye)", W: "var(--shine)", P: "var(--hat)", S: "var(--star)" };

function duckSVG() {
  let rects = "";
  DUCK.forEach((row, y) => [...row].forEach((c, x) => {
    if (COLORS[c]) rects += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${COLORS[c]}"/>`;
  }));
  return `<svg class="duck pop" viewBox="0 0 16 16" role="img" aria-label="고깔모자를 쓴 고무오리" shape-rendering="crispEdges">${rects}</svg>`;
}

/* ---------- 콘페티 ---------- */
function confetti() {
  const c = document.getElementById("confetti");
  const ctx = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  ctx.scale(dpr, dpr);
  const cols = ["#ffd23f", "#ff5f8f", "#ffb547", "#7fd1ff", "#9cf29c"];
  const bits = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * 80,
    y: innerHeight * 0.45,
    vx: (Math.random() - 0.5) * 11,
    vy: -Math.random() * 13 - 4,
    s: 4 + Math.random() * 5,
    col: cols[Math.floor(Math.random() * cols.length)],
  }));
  let frame = 0;
  (function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    bits.forEach(b => {
      b.vy += 0.32; b.vx *= 0.99; b.x += b.vx; b.y += b.vy;
      ctx.fillStyle = b.col;
      ctx.fillRect(Math.round(b.x), Math.round(b.y), b.s, b.s);
    });
    if (++frame < 200) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}
